<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streckenberechnung</title>

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f8cff">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        h2 { text-align: center; margin-bottom: 30px; font-weight: 600; }
        label { font-size: 0.9rem; color: #bbbbbb; }
        input {
            width: 100%; padding: 12px; margin-top: 8px;
            background-color: #1e1e1e; border: 1px solid #333;
            border-radius: 8px; color: #ffffff; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #4f8cff; }
        .result { margin-top: 25px; background-color: #1e1e1e; border-radius: 10px; padding: 20px; }
        .result p { margin: 10px 0; font-size: 0.95rem; }
        .result strong { color: #4f8cff; }

        .art {
    color: #ffffff;
    font-weight: 400; /* normal */
}
    </style>
</head>
<body>
    <h2>Streckenberechnung</h2>
    <label for="kilometer">Strecke in Kilometern</label>
    <input type="text" id="kilometer" placeholder="z.B. 2,5" inputmode="decimal" autocomplete="off" oninput="berechnen()">

    <div class="result" id="ausgabe"></div>

<script>
function berechnen() {
    let rawValue = document.getElementById("kilometer").value;

    // iOS-Safari: unerwünschte Zeichen entfernen
    rawValue = rawValue
        .trim()
        .replace(/\s/g, "")
        .replace(/,/g, ".")
        .replace(/[^0-9.]/g, "");

    const km = Number(rawValue);

    if (!isFinite(km) || km <= 0) {
        document.getElementById("ausgabe").innerHTML =
            "<p>Bitte eine gültige Strecke eingeben.</p>";
        return;
    }

    // Geschwindigkeit in km/h
    const geschwindigkeiten = {
        "⛰️ <strong>Schwieriges Gelände zu Fuß</strong> (2 kmH)": 2,
        "🚶‍➡️ <strong>Zu Fuß / schwieriges Gelände zu Pferd</strong> (4 kmH)": 4,
        "🐎 <strong>Zu Pferd (6 kmH)": 6,
        "🛶 <strong>Langsames Schiff (5 kmH)": 5,
        "⛴️ <strong>Binnenschifffahrt oder Fähren (9 kmH)": 9,
        "🚤 <strong>Schnelle Handels- oder Kriegsschiffe (18 kmH)": 18,
        "🚁 <strong>Flugschiff (25 kmH)": 25
    };

    // Tagesgrenze in Stunden
    const tageInStunden = {
        "⛰️ <strong>Schwieriges Gelände zu Fuß</strong> (2 kmH)": 8,
        "🚶‍➡️ <strong>Zu Fuß / schwieriges Gelände zu Pferd</strong> (4 kmH)": 8,
        "🐎 <strong>Zu Pferd</strong> (6 kmH)": 8,
        "🛶 <strong>Langsames Schiff</strong> (5 kmH)": 24,
        "⛴️ <strong>Binnenschifffahrt oder Fähren</strong> (9 kmH)": 24,
        "🚤 <strong>Schnelle Handels- oder Kriegsschiffe</strong> (18 kmH)": 24,
        "🚁 <strong>Flugschiff</strong> (25 kmH)": 24
    };

    let output = "";

    for (const art in geschwindigkeiten) {
        const tagesGrenze = tageInStunden[art];
        const zeitStunden = km / geschwindigkeiten[art];

        let tage = 0;
        let restStunden = 0;

        // Tage und Reststunden berechnen
        if (zeitStunden >= tagesGrenze) {
            tage = Math.floor(zeitStunden / tagesGrenze);
            restStunden = Math.floor(zeitStunden % tagesGrenze);
        } else {
            restStunden = Math.floor(zeitStunden);
        }

        const minuten = Math.round((zeitStunden - Math.floor(zeitStunden)) * 60);

        // Ausgabe bauen
        let tageText = "";
        if (tage > 0) {
            tageText = `<span style="color:#4f8cff;font-weight:600;">${tage} Tag${tage > 1 ? "e" : ""}</span>, `;
        }
        const stundenText = `<span style="color:#ff8c00;font-weight:600;">${restStunden} h</span>`;
        const minutenText = `<span style="color:#00cc66;font-weight:600;">${minuten} min</span>`;

        output += `<p><span class="art">${art}:</span> ${tageText}${stundenText} ${minutenText}</p>`;
    }

    document.getElementById("ausgabe").innerHTML = output;
}
</script>

</body>
</html>
