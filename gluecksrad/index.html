<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glücksrad PWA</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
  background-color: #121212;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  min-height: 100vh;
}

h1 { margin-bottom: 20px; font-weight: 600; text-align: center; }

.input-group {
  display: flex;
  flex-direction: column;
  width: 90%;
  max-width: 350px;
  margin-bottom: 15px;
}

label { margin-bottom: 6px; font-size: 0.95rem; color: #cccccc; }

input, textarea {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background-color: #1e1e1e;
  color: #ffffff;
  font-size: 1rem;
  margin-bottom: 10px;
  outline: none;
}

input:focus, textarea:focus { border-color: #4f8cff; }

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background-color: #4f8cff;
  color: white;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 5px;
  width: 50%;
  max-width: 180px;
  align-self: center;
}

button:active { opacity: 0.8; }

canvas { margin-top: 20px; border-radius: 50%; }
</style>
</head>
<body>

<h1>🎡 Glücksrad</h1>

<div class="input-group">
  <label for="count">Anzahl der Felder</label>
  <input type="number" id="count" value="6" min="2">
</div>

<div class="input-group">
  <label for="labels">Texte (je Zeile ein Feld)</label>
  <textarea id="labels" rows="6">Preis A
Preis B
Preis C
Preis D
Preis E
Preis F</textarea>
</div>

<button onclick="buildWheel()">Rad erstellen</button>
<button onclick="spin()">Drehen</button>

<canvas id="wheel" width="300" height="300"></canvas>
