<!DOCTYPE html>
<h1>🎡 Glücksrad</h1>


<label>Anzahl der Felder</label>
<input type="number" id="count" value="6" min="2" />


<label>Texte (je Zeile ein Feld)</label>
<textarea id="labels" rows="6">Preis A
Preis B
Preis C
Preis D
Preis E
Preis F</textarea>


<button onclick="buildWheel()">Rad erstellen</button>
<button onclick="spin()">Drehen</button>


<div id="pointer">🔻</div>
<canvas id="wheel" width="300" height="300"></canvas>


<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
let slices = [];
let angle = 0;
let spinning = false;


function buildWheel() {
const count = parseInt(document.getElementById("count").value);
const labels = document.getElementById("labels").value.split("\n");


slices = labels.slice(0, count);
drawWheel();
}


function drawWheel() {
const radius = canvas.width / 2;
const sliceAngle = (2 * Math.PI) / slices.length;


ctx.clearRect(0,0,canvas.width,canvas.height);


slices.forEach((text, i) => {
const start = angle + i * sliceAngle;
const end = start + sliceAngle;


ctx.beginPath();
ctx.moveTo(radius, radius);
ctx.arc(radius, radius, radius, start, end);
ctx.fillStyle = `hsl(${i * 360 / slices.length}, 70%, 50%)`;
ctx.fill();


ctx.save();
ctx.translate(radius, radius);
ctx.rotate(start + sliceAngle / 2);
ctx.textAlign = "right";
ctx.fillStyle = "white";
ctx.font = "14px sans-serif";
ctx.fillText(text, radius - 10, 5);
ctx.restore();
});
}


function spin() {
if (spinning) return;
spinning = true;


let speed = Math.random() * 0.3 + 0.3;


const interval = setInterval(() => {
angle += speed;
speed *= 0.97;
drawWheel();


if (speed < 0.002) {
clearInterval(interval);
spinning = false;
showResult();
}
}, 16);
}


function showResult() {
const sliceAngle = (2 * Math.PI) / slices.length;
const index = Math.floor(((2 * Math.PI - angle % (2 * Math.PI)) / sliceAngle)) % slices.length;
alert("Ergebnis: " + slices[index]);
}


buildWheel();
</script>


</body>
</html>
